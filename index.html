<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Latest News</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #202124;
      --muted: #687078;
      --line: #e4e7ec;
      --blue: #1a73e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 Arial, Helvetica, sans-serif;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .header-inner {
      max-width: 900px;
      margin: auto;
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-size: 1.25rem; font-weight: 700; }
    .brand span { color: var(--blue); }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      padding: 9px 13px;
      border-radius: 9px;
      font-size: .9rem;
      cursor: pointer;
    }
    button:hover { background: #f0f4fa; }
    main { max-width: 900px; margin: auto; padding: 24px 18px 40px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.7rem, 4vw, 2.3rem); }
    .intro { color: var(--muted); margin: 0 0 18px; }
    .categories { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 14px; }
    .category { flex: 0 0 auto; border-radius: 999px; }
    .category[aria-pressed="true"] {
      color: var(--blue);
      background: #e8f0fe;
      border-color: #c5d7fb;
    }
    .filters { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; }
    #sourceFilter { max-width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--text); }
    #loadMore { display:block; margin:18px auto 0; }
    #status { min-height: 24px; color: var(--muted); font-size: .9rem; margin: 4px 0 12px; }
    #news { display: grid; gap: 12px; }
    .story {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
    }
    .story h2 { margin: 0 0 8px; font-size: 1.08rem; line-height: 1.4; }
    .story h2 a { color: var(--text); text-decoration: none; }
    .story h2 a:hover { color: var(--blue); }
    .story { padding: 0; overflow: hidden; }
    .story .photo { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; background: #e4e7ec; }
    .story .text { padding: 16px; }
    .meta { color: var(--muted); font-size: .82rem; }
    .description { margin: 10px 0 0; color: #4f5965; font-size: .94rem; }
    .error { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px; color: var(--muted); }
    footer { max-width: 900px; margin: auto; padding: 0 18px 30px; color: var(--muted); font-size: .82rem; }
    footer a { color: var(--blue); }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">Latest <span>News</span></div>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main>
    <h1>Top stories</h1>
    <p class="intro">Automatically collected headlines, descriptions and images from configured RSS sources. Stories link to their original publishers.</p>

    <nav class="categories" aria-label="News categories">
      <button class="category" data-category="top" aria-pressed="true">Top stories</button>
      <button class="category" data-category="nigeria" aria-pressed="false">Nigeria</button>
      <button class="category" data-category="world" aria-pressed="false">World</button>
      <button class="category" data-category="entertainment" aria-pressed="false">Entertainment</button>
      <button class="category" data-category="sports" aria-pressed="false">Sports</button>
      <button class="category" data-category="technology" aria-pressed="false">Technology</button>
      <button class="category" data-category="science" aria-pressed="false">Science</button>
    </nav>

    <div class="filters">
      <label for="sourceFilter">Publisher:</label>
      <select id="sourceFilter"><option value="">All publishers</option></select>
    </div>
    <div id="status" role="status" aria-live="polite">Loading news…</div>
    <section id="news" aria-label="News headlines"></section>
    <button id="loadMore" type="button" hidden>Load more headlines</button>
  </main>

  <footer>
    Headlines and photos link to their original sources.
  </footer>

  <script>
    /*
      Feeds are downloaded every ~15 minutes by a GitHub Action
      (.github/workflows/news.yml) and saved in the /feeds folder,
      so the page reads them from the same site (no CORS problem).
    */
    const newsEl = document.getElementById("news");
    const statusEl = document.getElementById("status");
    const refreshBtn = document.getElementById("refresh");
    const sourceFilter = document.getElementById("sourceFilter");
    const loadMoreBtn = document.getElementById("loadMore");
    const categoryButtons = [...document.querySelectorAll("[data-category]")];
    let selectedCategory = "top";
    let loading = false;
    let allItems = [];
    let visibleLimit = 25;
    let lastUpdated = "";

    function textOf(node, selector) {
      return node.querySelector(selector)?.textContent?.trim() || "";
    }

    function safeHttpUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function findImage(item) {
      for (const name of ["content", "thumbnail"]) {
        for (const el of item.getElementsByTagNameNS("*", name)) {
          const url = safeHttpUrl(el.getAttribute("url") || "");
          if (url) return url;
        }
      }
      for (const el of item.getElementsByTagName("enclosure")) {
        const url = safeHttpUrl(el.getAttribute("url") || "");
        if (url && (el.getAttribute("type") || "image").startsWith("image")) return url;
      }
      for (const el of item.getElementsByTagName("*")) {
        if (["encoded", "description"].includes(el.localName)) {
          const m = (el.textContent || "").match(/<img[^>]+src=["']([^"']+)["']/i);
          if (m) {
            const url = safeHttpUrl(m[1].replace(/&amp;/g, "&"));
            if (url) return url;
          }
        }
      }
      return "";
    }

    function makeStory(item) {
      const title = textOf(item, "title") || "Untitled story";
      const link = safeHttpUrl(textOf(item, "link"));
      if (!link) return null;

      const sourceNode = [...item.children].find(el => el.localName === "source");
      const source = sourceNode?.textContent?.trim() || new URL(link).hostname.replace(/^www\./, "");
      const dateText = textOf(item, "pubDate");
      const date = dateText ? new Date(dateText) : null;
      const formattedDate = date && !Number.isNaN(date.getTime())
        ? date.toLocaleString()
        : "";

      const article = document.createElement("article");
      article.className = "story";

      const imageUrl = findImage(item);
      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "photo";
        img.src = imageUrl;
        img.alt = "";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.onerror = () => img.remove();
        article.appendChild(img);
      }

      const text = document.createElement("div");
      text.className = "text";

      const heading = document.createElement("h2");
      const anchor = document.createElement("a");
      anchor.href = link;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.textContent = title;
      heading.appendChild(anchor);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = source + (formattedDate ? " · " + formattedDate : "");

      const descriptionText = textOf(item, "description");
      if (descriptionText) {
        const description = document.createElement("p");
        description.className = "description";
        description.textContent = descriptionText.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim();
        text.appendChild(heading);
        text.appendChild(meta);
        text.appendChild(description);
      } else {
        text.append(heading, meta);
      }
      article.appendChild(text);
      return article;
    }

    function renderStories() {
      const selectedSource = sourceFilter.value;
      const filtered = allItems.filter(item => {
        const sourceNode = [...item.children].find(el => el.localName === "source");
        const source = sourceNode?.textContent?.trim() || "";
        return !selectedSource || source === selectedSource;
      });
      const shown = filtered.slice(0, visibleLimit);
      const fragment = document.createDocumentFragment();
      let count = 0;
      shown.forEach(item => {
        const story = makeStory(item);
        if (story) { fragment.appendChild(story); count++; }
      });
      newsEl.replaceChildren(fragment);
      statusEl.textContent = `${count} of ${filtered.length} headlines · ${new Set(filtered.map(item => [...item.children].find(el => el.localName === "source")?.textContent?.trim()).filter(Boolean).length)} publishers · Updated ${lastUpdated}`;
      loadMoreBtn.hidden = shown.length >= filtered.length;
      if (!count) {
        const message = document.createElement("div");
        message.className = "error";
        message.textContent = "No headlines found for this publisher/category.";
        newsEl.appendChild(message);
      }
    }

    async function loadNews() {
      if (loading) return;
      loading = true;
      refreshBtn.disabled = true;
      statusEl.textContent = "Loading news…";
      try {
        const response = await fetch("feeds/" + selectedCategory + ".xml?t=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("Feed file returned HTTP " + response.status);
        const xmlText = await response.text();
        const xml = new DOMParser().parseFromString(xmlText, "application/xml");
        if (xml.querySelector("parsererror")) throw new Error("The response was not valid RSS XML.");
        allItems = [...xml.querySelectorAll("item")];
        if (!allItems.length) throw new Error("No stories were found in the feed.");

        const sources = [...new Set(allItems.map(item => {
          const sourceNode = [...item.children].find(el => el.localName === "source");
          return sourceNode?.textContent?.trim() || new URL(textOf(item, "link")).hostname.replace(/^www\./, "");
        }))].sort((a, b) => a.localeCompare(b));
        const previousSource = sourceFilter.value;
        sourceFilter.replaceChildren(new Option("All publishers", ""));
        sources.forEach(source => sourceFilter.add(new Option(source, source)));
        sourceFilter.value = sources.includes(previousSource) ? previousSource : "";
        visibleLimit = 25;
        lastUpdated = new Date().toLocaleTimeString();
        renderStories();
      } catch (error) {
        console.error("RSS loading failed:", error);
        statusEl.textContent = "News could not be loaded.";
        const message = document.createElement("div");
        message.className = "error";
        message.textContent = "RSS error: " + error.message + " | Tried: " + new URL("feeds/" + selectedCategory + ".xml", location.href).href;
        newsEl.replaceChildren(message);
        loadMoreBtn.hidden = true;
      } finally {
        loading = false;
        refreshBtn.disabled = false;
      }
    }

    categoryButtons.forEach(button => {
      button.addEventListener("click", () => {
        selectedCategory = button.dataset.category;
        categoryButtons.forEach(item =>
          item.setAttribute("aria-pressed", String(item === button))
        );
        loadNews();
      });
    });

    sourceFilter.addEventListener("change", () => { visibleLimit = 25; renderStories(); });
    loadMoreBtn.addEventListener("click", () => { visibleLimit += 25; renderStories(); });
    refreshBtn.addEventListener("click", loadNews);
    loadNews();
    setInterval(loadNews, 5 * 60 * 1000);
  </script>
</body>
</html>
